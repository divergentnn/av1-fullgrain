name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # the decoder submodule + av1grain + av1-grain-seed, and the install scripts
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # x86-64: AVX2 kernels
            name: linux-x86_64
          - os: macos-14        # Apple Silicon: NEON kernels
            name: macos-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: Build (decoder/dav1d + tools)
        run: |
          meson setup build
          ninja -C build
          build/decoder/dav1d/tools/dav1d --version

      - name: Decoder grain tests (the pinned submodule)
        run: sh decoder/dav1d/tests/fullgrain/run.sh build/decoder/dav1d/tools/dav1d

      - name: av1grain and av1-grain-seed (also against libdav1d)
        run: |
          meson test -C build --suite av1grain --suite av1fg --suite av1fg-dav1d --print-errorlogs
          python3 tools/av1grain/av1grain_mp4.py --help >/dev/null
          build/tools/av1-grain-seed/av1-grain-seed --analyze decoder/dav1d/tests/fullgrain/timing_720p_10bit_fgt03.ivf

      - name: Install scripts parse
        run: |
          for f in install/macos/install.sh install/macos/uninstall.sh install/mpv/mpv-fullgrain browser/build.sh; do
            sh -n "$f"
          done
          bash -n install/arch/PKGBUILD

      - name: macOS installer (swap Homebrew's dav1d, check, restore)
        if: runner.os == 'macOS'
        run: |
          install/macos/install.sh
          F=decoder/dav1d/tests/fullgrain/fgt15_420_10bit_csfl.ivf
          BREW_DAV1D="$(brew --prefix dav1d)/bin/dav1d"
          dec() { "$BREW_DAV1D" -q -i "$F" --muxer md5 -o - --filmgrain 1; }
          full=$(dec)
          std=$(DAV1D_GRAIN_MODE=standard dec)
          echo "Homebrew dav1d after install: full $full, standard $std"
          test "$full" != "$std"
          install/macos/uninstall.sh
          stock=$(dec)
          echo "Homebrew dav1d after uninstall: $stock"
          test "$stock" = "$std"

  # browser/: the WebAssembly build of the decoder submodule, checked against
  # the decoder's committed hashes with the dav1d CLI under Node.js
  browser-wasm:
    name: browser kit (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Build (emsdk, grain module, player kit, Node.js dav1d CLI)
        run: NODE_CLI=1 bash browser/build.sh

      - name: Decoder grain tests on the WebAssembly build
        run: |
          ls -l browser/dist/fg-grain.wasm browser/dist/web
          sh decoder/dav1d/tests/fullgrain/run.sh browser/dist/node/dav1d-node

  # av1-grain-seed with MSVC (the decoder's film grain streams as extra fixtures)
  av1-grain-seed-windows:
    name: windows-x86_64 (av1-grain-seed, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: pip install meson ninja

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build av1-grain-seed
        run: |
          meson setup build -Ddav1d:enable_asm=false
          ninja -C build tools/av1-grain-seed/av1-grain-seed.exe

      - name: Test
        run: |
          meson test -C build --suite av1fg --no-rebuild --print-errorlogs
          build/tools/av1-grain-seed/av1-grain-seed.exe --analyze decoder/dav1d/tests/fullgrain/timing_720p_10bit_fgt03.ivf

  # the decoder on Windows as install/windows/README.md builds it: MSYS2 UCRT64, GCC
  decoder-windows:
    name: windows-x86_64 (decoder, MSYS2 GCC)
    runs-on: windows-latest
    steps:
      - name: Keep LF line endings (shell scripts, hash lists)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm

      - name: Build the decoder
        shell: msys2 {0}
        run: |
          meson setup build decoder/dav1d --buildtype=release
          ninja -C build
          ls build/src/*.dll
          # dav1d.exe needs libdav1d.dll next to it or on PATH
          PATH="$PWD/build/src:$PATH" build/tools/dav1d.exe --version

      - name: Decoder grain tests
        shell: msys2 {0}
        run: PATH="$PWD/build/src:$PATH" sh decoder/dav1d/tests/fullgrain/run.sh build/tools/dav1d.exe

  # gpu/: the GPU renderer on a CPU Vulkan driver (Mesa's lavapipe), checked picture by picture against the decoder
  # built from the submodule; unit tests also check that browser/web/grain-wgsl.mjs matches gpu/src/grain.wgsl
  gpu-renderer:
    name: GPU renderer (Linux, lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm ffmpeg aom-tools mesa-vulkan-drivers libvulkan1

      - name: Build the decoder and the renderer
        run: |
          meson setup build
          ninja -C build
          cd gpu && cargo build --release && cargo test --release

      - name: Exactness against the decoder
        env:
          WGPU_BACKEND: vulkan
          RUST_BACKTRACE: 1
        run: |
          set -x
          gpu/target/release/av1-fullgrain-gpu adapters
          gpu/tests/make-vectors.sh /tmp/vec 6
          gpu/target/release/av1-fullgrain-gpu check --dav1d build/decoder/dav1d/tools/dav1d \
              --av1grain build/tools/av1grain/av1grain --threads 2 \
              decoder/dav1d/tests/fullgrain/*.ivf /tmp/vec/*.ivf
          # this ffmpeg (6.1) prints only the seed: showinfo parameters must fail at the first picture, not at the end
          if gpu/target/release/av1-fullgrain-gpu decode --params-from showinfo -o /tmp/x.y4m \
              decoder/dav1d/tests/fullgrain/fgt15_420_10bit_csfl.ivf 2> /tmp/err.txt; then exit 1; fi
          cat /tmp/err.txt
          grep -q "picture 0: film grain side data" /tmp/err.txt

      - name: Bitstream parser against dav1d's (av1grain strip), and fuzzed
        run: |
          set -x
          mkdir -p /tmp/pairs
          for f in decoder/dav1d/tests/fullgrain/*.ivf /tmp/vec/*.ivf; do
            n=$(basename "$f" .ivf)
            cp "$f" "/tmp/pairs/$n.ivf"
            build/tools/av1grain/av1grain strip "$f" /tmp/nograin.ivf "/tmp/pairs/$n.json"
          done
          cd gpu
          AV1FG_TEST_PARAMS=/tmp/pairs cargo test --release -- --ignored
          AV1FG_FUZZ_ITERS=20000 cargo test fuzz_headers
